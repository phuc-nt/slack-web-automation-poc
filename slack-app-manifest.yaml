# Paste into https://api.slack.com/apps -> Create New App -> From a manifest.
display_information:
  name: Visitor Registration POC
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: Visitor Registration
    always_online: false
  slash_commands:
    - command: /visitor
      description: Register a building visitor
      usage_hint: "[optional: describe the visit in one sentence]"
      should_escape: false
  shortcuts:
    - name: Register a visitor
      type: global
      callback_id: register_visitor
      description: Open the visitor registration form
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - im:write
      - files:write
settings:
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
